name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Windows checks files out with CRLF line endings, which every formatter flags.
      - name: Formatting
        if: runner.os == 'macOS'
        run: |
          npx prettier --check .
          cargo fmt --all --check

      # Also type-checks, and leaves the dist folder the Tauri crate needs to compile.
      - name: Build the UI
        run: npm run build

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace
