name: Release

# Every merge into main is a release of the version in src-tauri/Cargo.toml.
on:
  push:
    branches: [main]

permissions:
  contents: write
  # The release notes come from the PR that was merged into main.
  pull-requests: read

# Two releases building at once would race for the same draft.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  draft:
    name: Draft the release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Read the version
        id: version
        run: |
          version=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d '"' -f 2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A version that was already released means it wasn't raised before merging.
      # A draft left by a failed run counts too, so it's never built over.
      - name: Make sure the version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "::error::v${{ steps.version.outputs.version }} already has a release or a draft. Raise the version with npm run release:version, or delete the old draft."
            exit 1
          fi

      # The notes are what the release PR into main says, then what to download.
      - name: Write the notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].body // ""' > notes.md
          cat >> notes.md <<EOF

          ## Download

          - **macOS 14+**: \`Lootify-Guard-$VERSION-macos.dmg\`
          - **Windows 10/11**: \`Lootify-Guard-$VERSION-windows-setup.exe\`, or \`-portable.zip\` to run without installing

          The builds aren't signed yet. On macOS, allow it in System Settings → Privacy & Security → Open Anyway. On Windows, press More info → Run anyway.
          EOF

      # A draft: nothing is public, and the tag is made only once it's published.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --draft \
            --target "${{ github.sha }}" \
            --title "Lootify Guard ${{ steps.version.outputs.version }}" \
            --notes-file notes.md

  build:
    name: Build (${{ matrix.name }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            # The .app is kept only when asked for; otherwise it's removed once in the dmg.
            args: --target universal-apple-darwin --bundles app,dmg
          - name: Windows
            os: windows-latest
            rust-targets: ''
            args: ''
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.draft.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      # The key signs the update packages; the app installs only what it signed.
      - run: npx tauri build ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # On CI Tauri skips laying out the DMG window (background, icon places).
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'

      - name: Package for macOS
        if: runner.os == 'macOS'
        run: |
          bundle=target/universal-apple-darwin/release/bundle
          mkdir out
          cp "$bundle/dmg/Lootify Guard_${VERSION}_universal.dmg" "out/Lootify-Guard-$VERSION-macos.dmg"
          # ditto keeps what a .app needs that plain zip loses.
          ditto -c -k --keepParent "$bundle/macos/Lootify Guard.app" "out/Lootify-Guard-$VERSION-macos.zip"
          # What the app downloads to update itself, with its signature.
          cp "$bundle/macos/Lootify Guard.app.tar.gz" "out/Lootify-Guard-$VERSION-macos.app.tar.gz"
          cp "$bundle/macos/Lootify Guard.app.tar.gz.sig" "out/Lootify-Guard-$VERSION-macos.app.tar.gz.sig"

      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item "target/release/bundle/nsis/Lootify Guard_${env:VERSION}_x64-setup.exe" "out/Lootify-Guard-${env:VERSION}-windows-setup.exe"
          # The app updates itself with the same installer, checked against this signature.
          Copy-Item "target/release/bundle/nsis/Lootify Guard_${env:VERSION}_x64-setup.exe.sig" "out/Lootify-Guard-${env:VERSION}-windows-setup.exe.sig"
          # The portable build is the bare program; Windows 10 and 11 come with the WebView2 it runs on.
          Copy-Item target/release/lootify-guard.exe "out/Lootify Guard.exe"
          Compress-Archive "out/Lootify Guard.exe" "out/Lootify-Guard-${env:VERSION}-windows-portable.zip"
          Remove-Item "out/Lootify Guard.exe"

      - name: Upload to the release
        shell: bash
        run: gh release upload "v$VERSION" out/* --clobber

  finish:
    name: Add checksums and the update manifest
    needs: [draft, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.draft.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Add SHA256SUMS.txt
        run: |
          mkdir files && cd files
          gh release download "v$VERSION" --repo "$REPO"
          sha256sum $(ls | grep -v '\.sig$') > ../SHA256SUMS.txt
          gh release upload "v$VERSION" ../SHA256SUMS.txt --repo "$REPO" --clobber

      # The app reads releases/latest/download/latest.json to find a new version.
      # The links work once the draft is published.
      - name: Add latest.json
        run: |
          base="https://github.com/$REPO/releases/download/v$VERSION"
          mac="Lootify-Guard-$VERSION-macos.app.tar.gz"
          win="Lootify-Guard-$VERSION-windows-setup.exe"
          gh api "repos/$REPO/commits/${{ github.sha }}/pulls" --jq '.[0].body // ""' > notes.md
          jq -n \
            --arg version "$VERSION" \
            --rawfile notes notes.md \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac_url "$base/$mac" \
            --rawfile mac_sig "files/$mac.sig" \
            --arg win_url "$base/$win" \
            --rawfile win_sig "files/$win.sig" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $date,
              platforms: {
                "darwin-aarch64": { url: $mac_url, signature: $mac_sig },
                "darwin-x86_64": { url: $mac_url, signature: $mac_sig },
                "windows-x86_64": { url: $win_url, signature: $win_sig }
              }
            }' > latest.json
          gh release upload "v$VERSION" latest.json --repo "$REPO" --clobber
