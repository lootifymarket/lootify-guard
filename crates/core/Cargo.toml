[package]
name = "lootify-guard-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
aes-gcm = { version = "0.11", features = ["zeroize"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.23"
hmac = { version = "0.13", features = ["zeroize"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "json", "multipart", "rustls-tls", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.11", default-features = false, features = ["zeroize"] }
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
steamguard = "0.18.4"
thiserror = "2"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
zeroize = { version = "1.9", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
