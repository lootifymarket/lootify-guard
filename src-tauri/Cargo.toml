[package]
name = "lootify-guard"
version = "0.1.0"
description = "Steam account manager for Lootify Market"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
lootify-guard-core = { path = "../crates/core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
thiserror = "2"
zeroize = "1.9"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "LAContext", "LAError", "block2"] }
security-framework = "3"
