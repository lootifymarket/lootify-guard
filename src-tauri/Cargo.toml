[package]
name = "lootify-guard"
version = "0.3.3"
description = "Steam account manager for Lootify Market"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
lootify-guard-core = { path = "../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["macos-proxy", "tray-icon", "unstable"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-dialog = "2.8"
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2.14"
thiserror = "2"
zeroize = "1.9"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSGeometry", "NSString"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "LAContext", "LAError", "block2"] }
security-framework = "3"
