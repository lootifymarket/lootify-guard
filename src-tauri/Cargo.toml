[package]
name = "lootify-guard"
version = "0.1.0"
description = "Steam account manager for Lootify Market"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
lootify-guard-core = { path = "../crates/core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.12", features = [] }
zeroize = "1.9"
